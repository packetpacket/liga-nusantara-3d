s[e.key.length===1?e.key.toLowerCase():e.key]=false);let joy=document.querySelector('#joy'),stick=document.querySelector('#stick'),pid=null;function moveJoy(e){let b=joy.getBoundingClientRect(),x=e.clientX-b.left-b.width/2,z=e.clientY-b.top-b.height/2,d=Math.hypot(x,z)||1,m=b.width*.32,s=Math.min(d,m)/d;axis={x:x*s/m,z:z*s/m};stick.style.transform='translate('+x*s+'px,'+z*s+'px)'}joy.onpointerdown=e=>{pid=e.pointerId;joy.setPointerCapture(pid);moveJoy(e)};joy.onpointermove=e=>{if(e.pointerId===pid)moveJoy(e)};function end(e){if(e.pointerId!==pid)return;pid=null;axis={x:0,z:0};stick.style.transform=''}joy.onpointerup=end;joy.onpointercancel=end;for(let id of ['shoot','pass','through','switch'])document.getElementById(id).onpointerdown=e=>{e.preventDefault();id==='switch'?switchP():kick(id)};let b=document.querySelector('#sprint');b.onpointerdown=e=>{sprint=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>sprint=false;}catch(err){const status=document.getElementById('status');if(status)status.textContent='Gagal menjalankan mesin game: '+(err&&err.message?err.message:String(err));const start=document.getElementById('start');if(start)start.onclick=()=>alert(status?.textContent||'Gagal menjalankan game');console.error(err)}})();
